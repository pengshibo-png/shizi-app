<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>B · 书页</title>
<link rel="stylesheet" href="../../packages/ui/src/tokens.css" />
<style>
  @font-face {
    font-family: 'ShiziWenKai';
    src: url('../../packages/content/assets/fonts/wenkai-subset.woff2') format('woff2');
    font-display: block;
  }

  /* B 案：书页。取"一本线装书翻开"的感覺——米色纸、靛蓝布面书脊、
     宋体标题、极窄的装饰线。比 A 案更静、更书卷，装饰更少。 */
  html, body { width: 800px; height: 1280px; overflow: hidden; }
  body {
    display: flex; flex-direction: column;
    padding: 0 40px 32px;
    --b-paper: #efe7d6;
    --b-ink: #1a1814;
    --b-muted: #5b5344;
    --b-rule: #cabfa6;
    --b-cloth: #1e3a5f;
    --b-seal: #8b4a2b;
    background: var(--b-paper);
    color: var(--b-ink);
  }

  .top { display: flex; align-items: center; justify-content: space-between; height: 44px; flex: none;
         font-size: 24px; line-height: 1; color: var(--b-muted); }

  /* 书眉：一条细线 + 册次，像书页的页眉 */
  .bookhead { margin-top: 8px; display: flex; align-items: center; gap: 16px; }
  .bookhead .rule { flex: 1; height: 1px; background: var(--b-rule); }
  .bookhead .no { font-size: 24px; line-height: 1.2; color: var(--b-muted); letter-spacing: .08em; }

  .greet { margin-top: 40px; }
  .greet h1 {
    font-family: var(--shi-font-hanzi);
    font-size: 92px; line-height: 1.05; font-weight: 400;
    letter-spacing: .02em;
  }
  .greet .sub { margin-top: 16px; font-size: 28px; line-height: 1.4; color: var(--b-muted); }

  /* 主行动不做成"卡片"，而是一段带书脊色的引文块 */
  .today { margin-top: 48px; display: flex; align-items: center; gap: 32px;
           border-left: 8px solid var(--b-cloth); padding: 24px 0 24px 32px; }
  .today .num { font-size: 120px; line-height: 0.86; font-weight: 500; color: var(--b-cloth);
                font-variant-numeric: tabular-nums; }
  .today .num small { font-size: 40px; font-weight: 400; }
  .today .txt .k { font-size: 38px; line-height: 1.25; }
  .today .txt .v { margin-top: 8px; font-size: 24px; line-height: 1.4; color: var(--b-muted); }

  /* 目录式列表：左侧编号，右侧页码，像书的目录 */
  .toc { margin-top: 48px; flex: 1; }
  .toc .item { display: flex; align-items: center; gap: 16px; height: 104px;
               border-bottom: 1px dotted var(--b-rule); }
  .toc .item:last-child { border-bottom: 0; }
  .toc .idx { flex: none; width: 52px; font-size: 24px; line-height: 1; color: var(--b-muted);
              font-variant-numeric: tabular-nums; }
  .toc .name { flex: 1; font-size: 32px; line-height: 1.2; }
  .toc .lead { flex: none; height: 1px; width: 40px; background: var(--b-rule); }
  .toc .pg { flex: none; width: 96px; text-align: right; font-size: 24px; line-height: 1.2;
             color: var(--b-muted); font-variant-numeric: tabular-nums; }
  .toc .done { color: var(--b-seal); }

  .cta { flex: none; height: 96px; border-radius: 0;
         background: var(--b-cloth); color: #fff;
         display: flex; align-items: center; justify-content: center; gap: 16px;
         font-size: 30px; font-weight: 500; line-height: 1; letter-spacing: .04em; }
</style>
</head>
<body>
  <div class="top"><span>9:24</span><span>晴 18°</span></div>

  <div class="bookhead"><span class="no">第一册</span><span class="rule"></span><span class="no">第 12 天</span></div>

  <div class="greet">
    <h1>今天还剩<br />3 项</h1>
    <div class="sub">昨天学了 20 个字，正确率 85%</div>
  </div>

  <div class="today">
    <div class="num">12<small>/20</small></div>
    <div class="txt">
      <div class="k">今天的新字</div>
      <div class="v">已学 12 个，还差 8 个</div>
    </div>
  </div>

  <div class="toc">
    <div class="item">
      <span class="idx">一</span><span class="name">听一听</span><span class="lead"></span>
      <span class="pg done">已完成</span>
    </div>
    <div class="item">
      <span class="idx">二</span><span class="name">复习 74 个字</span><span class="lead"></span>
      <span class="pg">还剩 74</span>
    </div>
    <div class="item">
      <span class="idx">三</span><span class="name">生活数学 · 认识人民币</span><span class="lead"></span>
      <span class="pg">3 题</span>
    </div>
    <div class="item">
      <span class="idx">四</span><span class="name">科普 · 一日三次</span><span class="lead"></span>
      <span class="pg">1 条</span>
    </div>
  </div>

  <div class="cta">接着学</div>
</body>
</html>
