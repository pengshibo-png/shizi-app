<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>方向 C · 关怀数据</title>
<style>
  /* ============================================================
     方向 C：关怀数据（Apple Health / Gentler Streak 式，但为老人调过）
     思路：老人最需要的是"我今天到底做得怎么样"，而不是"还有多少任务"。
           用一个大圆环 + 三个大数字回答这个问题，任务退到下面。
           不用红色（不制造压力），只用青绿/琥珀表达状态。
     配色：暖灰白 #F2F1EE 底 + 深墨绿 #14332B 主 + 琥珀 #C98A2E 辅
           （刻意避开暖纸+赭红这个 AI 默认家族）
     ============================================================ */
  @font-face {
    font-family: 'Kai';
    src: url('../../../packages/content/assets/fonts/wenkai-subset.woff2') format('woff2');
    font-display: block;
  }
  html, body { width: 393px; height: 851px; margin: 0; overflow: hidden; }
  body {
    background: #F2F1EE; color: #14332B;
    font-family: -apple-system, 'Noto Sans SC', system-ui, sans-serif;
    display: flex; flex-direction: column;
    padding: 0 20px 14px;
  }
  .status { height: 30px; flex: none; display: flex; align-items: center;
            justify-content: space-between; font-size: 12px; color: #7A8A82; }

  .hi { flex: none; margin-top: 2px; }
  .hi h1 { font-size: 26px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; margin: 0; }
  .hi p { margin: 4px 0 0; font-size: 14px; color: #5E6E66; line-height: 1.35; }

  /* 主角：圆环 + 中心数字。整屏唯一的"重"元素 */
  .ring-wrap { flex: none; display: flex; align-items: center;
               justify-content: center; margin-top: 8px; position: relative;
               height: 246px; }
  .ring { width: 246px; height: 246px; border-radius: 50%;
          background: conic-gradient(#14332B 0% 60%, #DCDAD4 60% 100%);
          display: grid; place-items: center; }
  .ring .hole { width: 78%; height: 78%; border-radius: 50%;
                background: #F2F1EE; display: flex; flex-direction: column;
                align-items: center; justify-content: center; gap: 0; }
  .ring .hole .num { font-size: 58px; font-weight: 800; line-height: 1;
                     letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .ring .hole .of { font-size: 15px; color: #7A8A82; margin-top: 2px; }
  .ring .hole .k { font-size: 12px; color: #7A8A82; margin-top: 6px;
                   letter-spacing: .06em; }

  /* 三个数字：用时 / 正解 / 连学 */
  .stats { flex: none; display: grid; grid-template-columns: 1fr 1fr 1fr;
           gap: 8px; margin-top: 6px; }
  .st { background: #fff; border-radius: 14px; padding: 12px 10px;
        display: flex; flex-direction: column; gap: 2px; }
  .st .v { font-size: 24px; font-weight: 700; line-height: 1;
           font-variant-numeric: tabular-nums; }
  .st .v small { font-size: 12px; font-weight: 500; color: #7A8A82; }
  .st .k { font-size: 11px; color: #7A8A82; letter-spacing: .04em; }

  /* 任务：一行一条，左侧一条状态色竖线 */
  .tasks { flex: 1; min-height: 0; margin-top: 12px; display: flex;
           flex-direction: column; gap: 6px; }
  .t { flex: 1; display: flex; align-items: center; gap: 10px;
       background: #fff; border-radius: 14px; padding: 0 14px;
       position: relative; overflow: hidden; }
  .t::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0;
               width: 4px; background: #DCDAD4; }
  .t.done::before { background: #14332B; }
  .t .nm { flex: 1; font-size: 18px; font-weight: 500; }
  .t .nm em { font-style: normal; font-size: 13px; color: #7A8A82;
              font-weight: 400; margin-left: 6px; }
  .t .chip { flex: none; font-size: 12px; font-weight: 600; padding: 4px 10px;
             border-radius: 999px; }
  .t.done .chip { background: #14332B; color: #F2F1EE; }
  .t.todo .chip { background: #F0EDE4; color: #C98A2E; }

  .go { flex: none; height: 80px; background: #14332B; color: #F2F1EE;
        border: 0; border-radius: 18px; width: 100%;
        font-size: 22px; font-weight: 700; letter-spacing: .06em;
        margin-top: 12px; }
</style>
</head>
<body>
  <div class="status"><span>9:24</span><span>第 12 天</span></div>

  <div class="hi">
    <h1>今天已经学了 12 个字</h1>
    <p>比昨天多 2 个 · 连续第 5 天</p>
  </div>

  <div class="ring-wrap">
    <div class="ring">
      <div class="hole">
        <span class="num">60</span>
        <span class="of">%</span>
        <span class="k">今日进度</span>
      </div>
    </div>
  </div>

  <div class="stats">
    <div class="st"><span class="v">18<small>分</small></span><span class="k">用时</span></div>
    <div class="st"><span class="v">85<small>%</small></span><span class="k">正解</span></div>
    <div class="st"><span class="v">5<small>天</small></span><span class="k">连学</span></div>
  </div>

  <div class="tasks">
    <div class="t done"><span class="nm">听一听</span><span class="chip">已毕</span></div>
    <div class="t todo"><span class="nm">复习<em>74 字</em></span><span class="chip">待办</span></div>
    <div class="t todo"><span class="nm">生活数学<em>认钞</em></span><span class="chip">3 题</span></div>
    <div class="t todo"><span class="nm">科普<em>一日三次</em></span><span class="chip">1 条</span></div>
  </div>

  <button class="go">接着学</button>
</body>
</html>
