<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>方向 B · 极简符号</title>
<style>
  /* ============================================================
     方向 B：极简符号（佐藤可士和式）
     思路：识字 App 的主角是「一个字」。那就让一个字占掉半个版面，
           纯色满铺，零装饰、零渐变、零阴影。字本身就是图形。
           这不是"卡片式 App"，是"汉字海报式 App"。
     配色：纸白 #FAFAF7 + 墨 #111111 + 朱 #E60012（整屏最多三色）
     ============================================================ */
  @font-face {
    font-family: 'Kai';
    src: url('../../../packages/content/assets/fonts/wenkai-subset.woff2') format('woff2');
    font-display: block;
  }
  html, body { width: 393px; height: 851px; margin: 0; overflow: hidden; }
  body {
    background: #FAFAF7; color: #111111;
    font-family: -apple-system, 'Noto Sans SC', system-ui, sans-serif;
    display: flex; flex-direction: column;
  }

  /* 顶部：一条纯红通栏，只放进度。红色只在这一处大面积出现 */
  .bar { flex: none; height: 96px; background: #E60012; color: #fff;
         padding: 10px 20px 0; display: flex; flex-direction: column;
         justify-content: center; }
  .bar .row { display: flex; align-items: baseline; justify-content: space-between; }
  .bar .n { font-size: 44px; font-weight: 800; line-height: 1; letter-spacing: -.02em;
            font-variant-numeric: tabular-nums; }
  .bar .n small { font-size: 18px; font-weight: 500; opacity: .85; }
  .bar .k { font-size: 13px; font-weight: 600; letter-spacing: .08em; opacity: .9; }

  /* 主体：巨字区。一个字占满宽度，这是整个 App 的视觉签名 */
  .hero { flex: 1; min-height: 0; display: flex;
          align-items: center; justify-content: center;
          position: relative; }
  .hero .zi {
    font-family: 'Kai', serif;
    font-size: 300px; line-height: .86;
    /* 楷体字面偏下，光学居中 */
    transform: translateY(-2%);
    letter-spacing: 0;
  }
  /* 巨字右下角一个极小的拼音，像标本签 */
  .hero .py { position: absolute; right: 22px; bottom: 26px;
              font-size: 30px; font-weight: 500; letter-spacing: .04em;
              color: #111; }
  /* 左上角的序号，小到几乎看不见，只是定位 */
  .hero .idx { position: absolute; left: 22px; top: 8px;
               font-size: 12px; color: #999; letter-spacing: .1em;
               font-variant-numeric: tabular-nums; }

  /* 底部：一行四段，纯文字，无卡片无边框无图标 */
  .list { flex: none; border-top: 1px solid #111; }
  .item { display: flex; align-items: center; justify-content: space-between;
          height: 62px; padding: 0 20px; border-bottom: 1px solid #E2E2E2; }
  .item:last-child { border-bottom: 0; }
  .item .l { display: flex; align-items: baseline; gap: 10px; }
  .item .l .t { font-size: 20px; font-weight: 500; }
  .item .l .s { font-size: 13px; color: #777; }
  .item .st { font-size: 14px; font-weight: 600; }
  .item.done .st { color: #E60012; }
  .item.todo .st { color: #111; }

  /* 主行动：整宽黑块，文字居中，只有一个箭头 */
  .go { flex: none; height: 84px; background: #111; color: #FAFAF7;
        display: flex; align-items: center; justify-content: center;
        font-size: 22px; font-weight: 700; letter-spacing: .12em;
        gap: 12px; border: 0; width: 100%; }
</style>
</head>
<body>
  <div class="bar">
    <div class="row">
      <span class="k">今天的新字</span>
      <span class="k">第 12 天</span>
    </div>
    <div class="row" style="margin-top:4px">
      <span class="n">12<small>/20</small></span>
      <span class="k">正解 85%</span>
    </div>
  </div>

  <div class="hero">
    <span class="idx">06 / 20</span>
    <span class="zi">重</span>
    <span class="py">zhòng</span>
  </div>

  <div class="list">
    <div class="item done"><span class="l"><span class="t">听一听</span></span><span class="st">已毕</span></div>
    <div class="item todo"><span class="l"><span class="t">复习</span><span class="s">74 字</span></span><span class="st">待办</span></div>
    <div class="item todo"><span class="l"><span class="t">生活数学</span><span class="s">认钞</span></span><span class="st">3 题</span></div>
    <div class="item todo"><span class="l"><span class="t">科普</span><span class="s">一日三次</span></span><span class="st">1 条</span></div>
  </div>

  <button class="go">接着学 <span>›</span></button>
</body>
</html>
